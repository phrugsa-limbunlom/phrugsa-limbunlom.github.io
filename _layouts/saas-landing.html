{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html { scroll-behavior: smooth; }
    </style>
  </head>

  <body class="saas-landing">

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    {% include scripts.html %}

    <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Scroll-reveal observer
      var reveals = document.querySelectorAll('.sl-reveal');
      if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.08, rootMargin: '0px 0px -32px 0px' });
        reveals.forEach(function(el) { observer.observe(el); });
      } else {
        reveals.forEach(function(el) { el.classList.add('is-visible'); });
      }

      // FAQ smooth open
      document.querySelectorAll('.sl-faq-item').forEach(function(item) {
        item.querySelector('summary').addEventListener('click', function(e) {
          var content = item.querySelector('.sl-faq-item__answer');
          if (content) {
            content.style.maxHeight = item.open ? '0' : content.scrollHeight + 'px';
          }
        });
      });
    });
    </script>

  </body>
</html>
